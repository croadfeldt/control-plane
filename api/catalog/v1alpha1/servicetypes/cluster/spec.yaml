openapi: 3.0.4
info:
  title: DCM Cluster Specification
  description: |-
    Generated from the UDLM registry by cmd/udlm-servicetype-gen — DO NOT hand-edit.
    Provider-agnostic Kubernetes cluster specification; the UDLM resource type is the source of truth.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths: {}
components:
  schemas:
    ClusterSpec:
      type: object
      description: |-
        A managed Kubernetes/OpenShift cluster with one or more node pools and a network. Derived from OSAC's `cluster` fulfillment type (osac-project/fulfillment-service); the spec is the vendor-neutral Intent contract a provider (e.g. OSAC Cluster Fulfillment via RHACM + Hosted Control Planes) realizes. Targets Network.VirtualNetwork and Platform.Hub are forthcoming OSAC-derived types.

        Provider-agnostic Kubernetes cluster specification, generated from the UDLM Compute.Cluster (v0.1.1) resource type — the UDLM registry is the source of truth. Non-portable provider settings go under provider_hints (CommonFields). Regenerate with cmd/udlm-servicetype-gen; do not hand-edit.
      allOf:
        - $ref: ../common.yaml#/components/schemas/CommonFields
        - type: object
          required:
            - release
            - node_pools
          properties:
            release:
              type: string
              description: Platform release, e.g. 4.16 (OpenShift).
            node_pools:
              type: array
              items:
                $ref: '#/components/schemas/NodePool'
            network:
              $ref: '#/components/schemas/Network'
          additionalProperties: true
    NodePool:
      type: object
      required:
        - name
        - host_type
        - count
      properties:
        name:
          type: string
        host_type:
          type: string
          description: Resource Type name of the node shape (Compute.HostType — forthcoming).
        count:
          type: integer
          minimum: 1
        instance_size:
          type: string
          description: Provider-neutral node size class (small|medium|large) — sizes each node in the pool; the provider maps it to a concrete node shape at naturalization (common-elements §2.2, ADR-014).
      additionalProperties: true
    Network:
      type: object
      properties:
        pod_cidr:
          type: string
          pattern: ^[0-9./]+$
        service_cidr:
          type: string
          pattern: ^[0-9./]+$
      additionalProperties: true
