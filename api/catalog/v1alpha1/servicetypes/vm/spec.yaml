openapi: 3.0.4
info:
  title: DCM Virtual Machine Specification
  description: |-
    Generated from the UDLM registry by cmd/udlm-servicetype-gen — DO NOT hand-edit.
    Provider-agnostic virtual machine specification; the UDLM resource type is the source of truth.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths: {}
components:
  schemas:
    VMSpec:
      type: object
      description: |-
        A virtual compute instance with CPU, memory, a guest OS, and optional attached disks and network interfaces.

        Provider-agnostic virtual machine specification, generated from the UDLM Compute.VirtualMachine (v0.3.0) resource type — the UDLM registry is the source of truth. Non-portable provider settings go under provider_hints (CommonFields). Regenerate with cmd/udlm-servicetype-gen; do not hand-edit.

        Sizing constraint (UDLM anyOf): provide exactly one of [instance_size] OR [vcpu + memory].
      allOf:
        - $ref: ../common.yaml#/components/schemas/CommonFields
        - type: object
          required:
            - guest_os
          properties:
            instance_size:
              type: string
              description: Provider-neutral size class (small|medium|large, ordered/comparable — common-elements §2.2, ADR-014). Size by class IN PLACE OF vcpu+memory; the provider maps it to concrete resources at naturalization (ADR-023). anyOf enforces sizing by class OR raw.
            vcpu:
              $ref: '#/components/schemas/Vcpu'
            memory:
              $ref: '#/components/schemas/Memory'
            guest_os:
              $ref: '#/components/schemas/GuestOs'
            disks:
              type: array
              items:
                $ref: '#/components/schemas/Disk'
            placement:
              $ref: '#/components/schemas/Placement'
            networks:
              type: array
              description: Network attachment INTENT — each entry SELECTS an existing Network.VirtualNetwork (platform-layer and/or provider-advertised) the NIC attaches to; the responsible network provider + policy decide eligibility. The VM references existing networks, it does not define network segments itself.
              items:
                $ref: '#/components/schemas/Network'
            power:
              $ref: '#/components/schemas/Power'
          additionalProperties: true
    Vcpu:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          description: Number of virtual CPUs.
          minimum: 1
      additionalProperties: true
    Memory:
      type: object
      required:
        - size
      properties:
        size:
          type: string
          description: Memory allocation, e.g. 16GB.
          pattern: ^[0-9]+(MB|GB|TB)$
      additionalProperties: true
    GuestOs:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Guest OS image identifier, e.g. rhel-9.
      additionalProperties: true
    Disk:
      type: object
      required:
        - size
      properties:
        size:
          type: string
          pattern: ^[0-9]+(GB|TB)$
        storage_class:
          type: string
      additionalProperties: true
    Placement:
      type: object
      description: 'Placement INTENT expressed as a SELECTION of an existing Facility.Location (populated by a platform data layer and/or a Facility.Location provider), plus affinity relative to other existing resources. Policy governs which locations a given consumer may select; the VM only references one — it does not define locations itself (ADR-009 §4: guidance, not a gate).'
      properties:
        location_ref:
          type: string
          description: handle/uuid of an existing Facility.Location the VM is placed in — chosen from the eligible set (platform-layer + provider-advertised, policy-filtered). Also carried as a references->Facility.Location relationship.
        zone:
          type: string
          description: Sovereignty/availability zone constraint (resolved against the selected location's zone).
        affinity:
          type: array
          description: Co-location / separation intent relative to OTHER existing resources.
          items:
            $ref: '#/components/schemas/Affinity'
      additionalProperties: true
    Affinity:
      type: object
      required:
        - target
        - rule
      properties:
        target:
          type: string
          description: handle/uuid of an existing resource to co-locate with or avoid.
        rule:
          type: string
          enum:
            - affinity
            - anti_affinity
      additionalProperties: true
    Network:
      type: object
      required:
        - network_ref
      properties:
        name:
          type: string
          description: Local NIC name, e.g. eth0.
        network_ref:
          type: string
          description: handle/uuid of an existing Network.VirtualNetwork the NIC attaches to (selected from the eligible set). Carried as a references->Network.VirtualNetwork relationship.
        ip_mode:
          type: string
          description: 'How the address is procured (ADR-009 fulfillment): dynamic=allocate, static=a specific requested address, byo=a consumer-supplied existing Network.IPAddress reference.'
          enum:
            - dynamic
            - static
            - byo
          default: dynamic
        requested_address:
          type: string
          description: 'For ip_mode=static/byo: the desired/existing address (byo references an existing Network.IPAddress).'
        mac:
          type: string
          description: Optional requested MAC address.
      additionalProperties: true
    Power:
      type: object
      description: Desired guest power state the provider drives to (KubeVirt runStrategy / Redfish PowerState). Distinct from the four-state lifecycle_state.
      properties:
        desired_state:
          type: string
          description: Target guest power state.
          enum:
            - running
            - stopped
            - suspended
          default: running
      additionalProperties: true
