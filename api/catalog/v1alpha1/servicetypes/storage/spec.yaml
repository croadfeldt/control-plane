openapi: 3.0.4
info:
  title: DCM Storage Specification
  description: |-
    Generated from the UDLM registry by cmd/udlm-servicetype-gen — DO NOT hand-edit.
    Provider-agnostic storage volume specification; the UDLM resource type is the source of truth.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths: {}
components:
  schemas:
    StorageSpec:
      type: object
      description: |-
        A CONSUMABLE persistent storage volume — the block or file volume a workload attaches, as distinct from the Storage.Cluster that PROVISIONS it (the platform) and the physical device that backs it. Vendor-neutral Tier-1: provisioners (Ceph RBD/CephFS, cloud CSI drivers, NFS) are the provider, never the type. Adopts Kubernetes PersistentVolumeClaim/CSI + SNIA Swordfish Volume.

        Provider-agnostic storage volume specification, generated from the UDLM Storage.Volume (v0.2.0) resource type — the UDLM registry is the source of truth. Non-portable provider settings go under provider_hints (CommonFields). Regenerate with cmd/udlm-servicetype-gen; do not hand-edit.
      allOf:
        - $ref: ../common.yaml#/components/schemas/CommonFields
        - type: object
          required:
            - capacity
            - access_mode
          properties:
            capacity:
              type: string
              description: Requested capacity, Kubernetes quantity form (e.g. 100Gi). SNIA Swordfish CapacityBytes maps here.
              pattern: ^[0-9]+(Ki|Mi|Gi|Ti|Pi|K|M|G|T|P)?B?$
            access_mode:
              type: string
              description: 'Attachment concurrency (Kubernetes PVC accessModes: RWO/ROX/RWX/RWOP).'
              enum:
                - read_write_once
                - read_only_many
                - read_write_many
                - read_write_once_pod
            volume_mode:
              type: string
              description: Filesystem-mounted vs raw block device (Kubernetes PVC volumeMode).
              enum:
                - filesystem
                - block
              default: filesystem
            storage_class:
              type: string
              description: The provider's storage class / profile the volume is provisioned from (e.g. an rbd class). The class name is provider data; the reference to the providing cluster is the depends_on relationship.
            retain_on_release:
              type: boolean
              description: 'Reclaim policy: true = Retain (keep data after the consumer releases it), false = Delete.'
              default: false
          additionalProperties: true
