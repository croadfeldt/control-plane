# Catalog subsystem test stack. Credentials: set POSTGRES_USER and
# POSTGRES_PASSWORD in the environment or in a .env file (see ../../../.env.example).

services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    environment:
      POSTGRESQL_DATABASE: catalog_manager_test
      POSTGRESQL_USER: ${POSTGRES_USER:-test_user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-test_user} -d catalog_manager_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  placement-manager:
    image: wiremock/wiremock:3x
    ports:
      - "28081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/mappings"]
      interval: 2s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: ../../..
      dockerfile: Containerfile
    environment:
      BIND_ADDRESS: "0.0.0.0:8080"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: catalog_manager_test
      DB_USER: ${POSTGRES_USER:-test_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
      PLACEMENT_MANAGER_URL: "http://placement-manager:8080"
      NATS_DISABLED: "true"
      AUTH_DISABLED: "true"
      DCM_ADMIN_SUBJECT: "test-admin-sub"
    ports:
      - "28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      placement-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data: {}
