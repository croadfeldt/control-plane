# Policy subsystem test stack. Shared env: test/subsystem/.env (see .env.example).

services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    env_file: ../.env
    environment:
      POSTGRESQL_DATABASE: policy_manager_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRESQL_USER\" -d policy_manager_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ../../..
      dockerfile: Containerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      BIND_ADDRESS: "0.0.0.0:8080"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: policy_manager_test
      LOG_LEVEL: debug
      NATS_DISABLED: "true"
      AUTH_DISABLED: "true"
      DCM_ADMIN_SUBJECT: "test-admin-sub"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
