{{- if .Values.acmClusterServiceProvider.enabled }}
{{- if not (or .Values.acmClusterServiceProvider.pullSecret .Values.acmClusterServiceProvider.pullSecretRef) }}
  {{- fail "acmClusterServiceProvider.pullSecret or acmClusterServiceProvider.pullSecretRef is required (base64-encoded .dockerconfigjson); the referenced Secret must store the value via stringData so the SP receives it base64-encoded" }}
{{- end }}
{{- if not (or .Values.acmClusterServiceProvider.kubeconfig .Values.acmClusterServiceProvider.kubeconfigRef) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dcm.fullname" . }}-acm-cluster-sp
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dcm.fullname" . }}-acm-cluster-sp
  namespace: {{ .Values.acmClusterServiceProvider.namespace }}
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["hypershift.openshift.io"]
    resources: ["hostedclusters", "nodepools"]
    verbs: ["list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dcm.fullname" . }}-acm-cluster-sp
  namespace: {{ .Values.acmClusterServiceProvider.namespace }}
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dcm.fullname" . }}-acm-cluster-sp
subjects:
  - kind: ServiceAccount
    name: {{ include "dcm.fullname" . }}-acm-cluster-sp
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dcm.clusterResourceName" . }}-acm-cluster-sp
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hive.openshift.io"]
    resources: ["clusterimagesets"]
    verbs: ["list"]
  - apiGroups: ["hypershift.openshift.io"]
    resources: ["hostedclusters"]
    verbs: ["list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["list"]
  - apiGroups: ["agent-install.openshift.io"]
    resources: ["agents"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dcm.clusterResourceName" . }}-acm-cluster-sp
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dcm.clusterResourceName" . }}-acm-cluster-sp
subjects:
  - kind: ServiceAccount
    name: {{ include "dcm.fullname" . }}-acm-cluster-sp
    namespace: {{ .Release.Namespace }}
---
{{- else if .Values.acmClusterServiceProvider.kubeconfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dcm.fullname" . }}-acm-cluster-kubeconfig
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
type: Opaque
data:
  kubeconfig: {{ .Values.acmClusterServiceProvider.kubeconfig | b64enc | quote }}
---
{{- end }}
{{- if .Values.acmClusterServiceProvider.pullSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dcm.fullname" . }}-acm-cluster-pull-secret
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
type: Opaque
stringData:
  pull-secret: {{ .Values.acmClusterServiceProvider.pullSecret | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dcm.fullname" . }}-acm-cluster-service-provider
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
    {{- include "dcm.selectorLabels" (dict "context" . "component" "acm-cluster-service-provider") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dcm.selectorLabels" (dict "context" . "component" "acm-cluster-service-provider") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dcm.selectorLabels" (dict "context" . "component" "acm-cluster-service-provider") | nindent 8 }}
    spec:
      {{- if not (or .Values.acmClusterServiceProvider.kubeconfig .Values.acmClusterServiceProvider.kubeconfigRef) }}
      serviceAccountName: {{ include "dcm.fullname" . }}-acm-cluster-sp
      {{- end }}
      containers:
        - name: acm-cluster-service-provider
          image: "{{ .Values.acmClusterServiceProvider.image }}:{{ include "dcm.imageTag" (dict "tag" .Values.acmClusterServiceProvider.tag "global" .Values.global) }}"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SP_NAME
              value: {{ .Values.acmClusterServiceProvider.spName | quote }}
            - name: SP_ENDPOINT
              value: "http://{{ include "dcm.fullname" . }}-acm-cluster-service-provider:8080"
            - name: DCM_REGISTRATION_URL
              value: "http://{{ include "dcm.fullname" . }}-control-plane:8080/api/v1alpha1"
            - name: SP_NATS_URL
              value: "nats://{{ include "dcm.fullname" . }}-nats:4222"
            - name: SP_CLUSTER_NAMESPACE
              value: {{ .Values.acmClusterServiceProvider.namespace | quote }}
            {{- if .Values.acmClusterServiceProvider.baseDomain }}
            - name: SP_BASE_DOMAIN
              value: {{ .Values.acmClusterServiceProvider.baseDomain | quote }}
            {{- end }}
            - name: SP_PULL_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.acmClusterServiceProvider.pullSecret }}
                  name: {{ include "dcm.fullname" . }}-acm-cluster-pull-secret
                  key: pull-secret
                  {{- else }}
                  name: {{ .Values.acmClusterServiceProvider.pullSecretRef }}
                  key: pull-secret
                  {{- end }}
            {{- if .Values.acmClusterServiceProvider.defaultInfraEnv }}
            - name: SP_DEFAULT_INFRA_ENV
              value: {{ .Values.acmClusterServiceProvider.defaultInfraEnv | quote }}
            {{- end }}
            {{- if .Values.acmClusterServiceProvider.agentNamespace }}
            - name: SP_AGENT_NAMESPACE
              value: {{ .Values.acmClusterServiceProvider.agentNamespace | quote }}
            {{- end }}
            {{- if or .Values.acmClusterServiceProvider.kubeconfig .Values.acmClusterServiceProvider.kubeconfigRef }}
            - name: KUBECONFIG
              value: /kubeconfig/kubeconfig
            {{- end }}
          {{- if or .Values.acmClusterServiceProvider.kubeconfig .Values.acmClusterServiceProvider.kubeconfigRef }}
          volumeMounts:
            - name: kubeconfig
              mountPath: /kubeconfig
              readOnly: true
          {{- end }}
      {{- if or .Values.acmClusterServiceProvider.kubeconfig .Values.acmClusterServiceProvider.kubeconfigRef }}
      volumes:
        - name: kubeconfig
          secret:
            {{- if .Values.acmClusterServiceProvider.kubeconfig }}
            secretName: {{ include "dcm.fullname" . }}-acm-cluster-kubeconfig
            {{- else }}
            secretName: {{ .Values.acmClusterServiceProvider.kubeconfigRef }}
            {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dcm.fullname" . }}-acm-cluster-service-provider
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dcm.selectorLabels" (dict "context" . "component" "acm-cluster-service-provider") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
{{- end }}
