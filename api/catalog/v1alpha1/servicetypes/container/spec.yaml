openapi: 3.0.4

info:
  title: DCM Container Specification
  description: |
    Provider-agnostic container specification based on OCI standards.

    This schema defines minimal portable fields common across all container
    platforms (Kubernetes, Docker, Podman, OpenShift, CRI-O, containerd).

    Platform-specific configuration (security contexts, probes, volumes)
    should be specified via provider_hints.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

paths: {}

components:
  schemas:
    ContainerSpec:
      type: object
      description: |
        Provider-agnostic container specification.

        Includes common fields (service_type, metadata, provider_hints)
        plus container-specific fields for image, resources, process, and network.

        Providers translate this abstract specification to their native format.
      allOf:
        - $ref: '../common.yaml#/components/schemas/CommonFields'
        - type: object
          required:
            - image
            - resources
          properties:
            image:
              $ref: '#/components/schemas/Image'

            resources:
              $ref: '#/components/schemas/ContainerResources'

            process:
              $ref: '#/components/schemas/Process'

            network:
              $ref: '#/components/schemas/Network'

            endpoints:
              type: array
              description: |
                Resolved connection endpoints (response-only).
                Each entry is dialable via address + port; scope indicates
                reachability. Omitted when no ports are exposed
                (all visibility=none).
              readOnly: true
              items:
                $ref: '#/components/schemas/ContainerEndpoint'
              example:
                - address: "10.96.45.12"
                  port: 8080
                  scope: internal
                - address: "34.123.45.67"
                  port: 8080
                  scope: external

          additionalProperties: true

    Image:
      type: object
      description: |
        Container image specification.
        Based on OCI Image Specification for portable image references.
      required:
        - reference
      properties:
        reference:
          type: string
          description: |
            Complete OCI image reference.

            Format: [REGISTRY/]REPOSITORY[:TAG|@DIGEST]
            Examples:
            - quay.io/organization/app:v1.2.3 (registry + tag)
            - docker.io/library/nginx:latest (Docker Hub)
            - gcr.io/project/image@sha256:abc123... (digest)
          example: quay.io/app/webserver:v1.2.3
      additionalProperties: true

    ContainerResources:
      type: object
      description: Resource allocation (CPU and memory)
      required:
        - cpu
        - memory
      properties:
        cpu:
          $ref: '../common.yaml#/components/schemas/CpuResources'
        memory:
          $ref: '../common.yaml#/components/schemas/MemoryResources'
      additionalProperties: true

    Process:
      type: object
      description: Container process configuration (optional)
      properties:
        command:
          type: array
          description: |
            Entrypoint override.
            Replaces the container image's default entrypoint.
          items:
            type: string
          example:
            - /bin/sh
            - -c
        args:
          type: array
          description: |
            Arguments to the entrypoint.
            Passed to the command or the container's default entrypoint.
          items:
            type: string
          example:
            - --config
            - /etc/app/config.yaml
        env:
          type: array
          description: Environment variables
          items:
            $ref: '#/components/schemas/EnvVar'
      additionalProperties: true

    EnvVar:
      type: object
      description: Environment variable definition
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: Variable name
          example: PORT
        value:
          type: string
          description: Variable value
          example: "8080"
      additionalProperties: true

    Network:
      type: object
      description: Network and port configuration (optional)
      properties:
        ports:
          type: array
          description: Container ports to expose
          items:
            $ref: '#/components/schemas/ContainerPort'
      additionalProperties: true

    ContainerPort:
      type: object
      description: Container port specification
      required:
        - container_port
        - visibility
      properties:
        container_port:
          $ref: '../common.yaml#/components/schemas/NetworkPort'
        visibility:
          type: string
          description: |
            How this port is exposed to consumers.

            - none: Port is not exposed outside the container process
            - internal: Exposed to the host or cluster network
              (e.g., Docker -p, Kubernetes ClusterIP Service)
            - external: Reachable from outside the host/cluster
              (e.g., OpenShift Route, Kubernetes Ingress/LoadBalancer)
          enum:
            - none
            - internal
            - external
          example: internal
      additionalProperties: true

    ContainerEndpoint:
      type: object
      description: |
        Provider-agnostic connection endpoint (response-only).
      required:
        - address
        - port
        - scope
      properties:
        address:
          type: string
          description: IP address or hostname to dial
          example: "10.96.45.12"
        port:
          type: integer
          description: Port to dial on address
          minimum: 1
          maximum: 65535
          example: 8080
        scope:
          type: string
          description: |
            Reachability of this endpoint: internal or external.
            Aligns with network.ports[].visibility (none yields no endpoint).
          pattern: '^(internal|external)$'
          example: internal
        protocol:
          type: string
          description: Transport protocol (TCP or UDP). Optional.
          pattern: '^(TCP|UDP)$'
          example: TCP
      additionalProperties: true
