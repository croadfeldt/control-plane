openapi: 3.0.4

info:
  title: DCM Common Schema Fields
  description: |
    Common fields shared by all DCM service type specifications
    (VM, Container, Database, Cluster, Storage).

    These fields provide:
    - Schema versioning for evolution
    - Metadata for governance and tagging
    - Provider hints for platform-specific configuration
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

paths: {}

components:
  schemas:
    ServiceType:
      type: string
      description: |
        Service type identifier.
        Makes the payload self-describing and enables routing/validation.
      enum:
        - vm
        - container
        - database
        - cluster
        - storage
        - network
        - three-tier-app-demo
      example: vm

    ServiceMetadata:
      type: object
      description: |
        Resource metadata for identification and governance.
        Used by all service type specifications.
      required:
        - name
      properties:
        name:
          type: string
          description: |
            Resource name identifier.
            Must be unique within the namespace.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          minLength: 1
          maxLength: 63
          example: my-dev-vm

        namespace:
          type: string
          description: |
            Provider administrative namespace or equivalent where the
            resource was provisioned (response-only).

            Providers map their native grouping concept into this field,
            for example Kubernetes namespace, GCP project, OpenStack
            project, or Azure resource group.
          readOnly: true
          example: production

        labels:
          type: object
          description: |
            Key-value pairs for tagging and filtering.
            Both keys and values must be strings.
          additionalProperties:
            type: string
          example:
            environment: production
            owner: platform-team

    ProviderHints:
      type: object
      description: |
        Optional provider-specific configuration.

        Allows platform-specific settings without breaking portability.
        Providers use hints they recognize and ignore unknown hints.

        Keys are provider identifiers (e.g., kubevirt, vmware, aws).
        Values are provider-specific configuration objects.
      additionalProperties:
        type: object
        additionalProperties: true
      example:
        kubevirt:
          instanceType: u1.large
        vmware:
          vmxVersion: "17"
        aws:
          instanceType: t3.xlarge

    CpuResources:
      type: object
      description: CPU allocation in whole cores or millicores (e.g. 2, 500m, 1000m = 1 core)
      required:
        - min
        - max
      properties:
        min:
          type: string
          description: Minimum guaranteed CPU in whole cores or millicores
          pattern: '^[1-9][0-9]*m?$'
          example: "500m"
        max:
          type: string
          description: Maximum allowed CPU in whole cores or millicores
          pattern: '^[1-9][0-9]*m?$'
          example: "1000m"
      additionalProperties: true

    MemoryResources:
      type: object
      description: Memory allocation
      required:
        - min
        - max
      properties:
        min:
          type: string
          description: Minimum guaranteed memory with unit suffix
          pattern: '^[0-9]+(MB|GB|TB)$'
          example: 1GB
        max:
          type: string
          description: Maximum allowed memory with unit suffix
          pattern: '^[0-9]+(MB|GB|TB)$'
          example: 2GB
      additionalProperties: true

    NetworkPort:
      type: integer
      description: Port number inside container
      minimum: 1
      maximum: 65535
      example: 8080

    CommonFields:
      type: object
      description: |
        Common fields included in all service type specifications.
        These provide versioning, extensibility, and provider-specific configuration.
      required:
        - service_type
        - metadata
      properties:
        id:
          type: string
          description: |
            Unique identifier for the resource.
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          readOnly: true
          example: "vm-abc123"
        
        status:
          type: string
          description: |
            Current status of the resource.
          readOnly: true
          example: running
        
        status_message:
          type: string
          description: Human-readable message providing details about the current status
          readOnly: true
          example: "Resource is running normally"
        
        path:
          type: string
          description: |
            Resource path or location within the system hierarchy.
          readOnly: true
          example: "/production/us-east/compute"
        
        create_time:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the resource was created (RFC 3339)
          example: '2026-01-13T10:30:00Z'
        
        update_time:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the resource was last updated (RFC 3339)
          example: '2026-01-13T15:45:30Z'
        
        service_type:
          $ref: '#/components/schemas/ServiceType'
        
        metadata:
          $ref: '#/components/schemas/ServiceMetadata'

        provider_hints:
          $ref: '#/components/schemas/ProviderHints'
