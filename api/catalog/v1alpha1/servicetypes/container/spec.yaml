openapi: 3.0.4
info:
  title: DCM Container Specification
  description: |-
    Generated from the UDLM registry by cmd/udlm-servicetype-gen — DO NOT hand-edit.
    Provider-agnostic container workload specification; the UDLM resource type is the source of truth.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths: {}
components:
  schemas:
    ContainerSpec:
      type: object
      description: |-
        A container workload — image, resources, environment, mounts, and exposed ports — realized and managed by a *resource* provider (OCP, podman) under the four-state lifecycle (DCM ADR-023). Models the service/workload layer of the estate: MCP servers, the media stack, mail, etc. Secret material is never inline — env/mounts reference a Security.CredentialRef.

        Provider-agnostic container workload specification, generated from the UDLM Compute.Container (v0.3.0) resource type — the UDLM registry is the source of truth. Non-portable provider settings go under provider_hints (CommonFields). Regenerate with cmd/udlm-servicetype-gen; do not hand-edit.
      allOf:
        - $ref: ../common.yaml#/components/schemas/CommonFields
        - type: object
          required:
            - image
          properties:
            image:
              type: string
              description: The container image — either the inline OCI reference (first branch) OR a data_reference to a governed container_image reference-data layer. The reference form lets DCM compute the change-impact blast radius when a base image or embedded library is bumped (UDLM ADR-012; DCM ADR-024) — an inline OCI string cannot be cascaded.
            command:
              type: array
              description: Entrypoint override.
              items:
                type: string
            args:
              type: array
              items:
                type: string
            resources:
              $ref: '#/components/schemas/Resources'
            process:
              $ref: '#/components/schemas/Process'
            network:
              $ref: '#/components/schemas/Network'
            runtime:
              $ref: '#/components/schemas/Runtime'
          additionalProperties: true
    Resources:
      type: object
      properties:
        instance_size:
          type: string
          description: Provider-neutral size class (small|medium|large) — size by class in place of cpu/memory; the provider maps it at naturalization (common-elements §2.2, ADR-014).
        cpu:
          type: number
          description: vCPU request in cores.
          minimum: 0.1
        memory:
          type: string
          pattern: ^[0-9]+(Mi|Gi|MB|GB)$
      additionalProperties: true
    Process:
      type: object
      properties:
        env:
          type: array
          items:
            $ref: '#/components/schemas/Env'
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/Mount'
      additionalProperties: true
    Env:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        value:
          type: string
          description: Literal value — non-secret only.
        value_from:
          $ref: '#/components/schemas/ValueFrom'
      additionalProperties: true
    ValueFrom:
      type: object
      description: Reference to a Security.CredentialRef or config source. Secret material is NEVER inline (DCM ADR-023).
      properties:
        credential_ref:
          type: string
          description: handle or uuid of a Security.CredentialRef
        key:
          type: string
      additionalProperties: true
    Mount:
      type: object
      required:
        - mount_path
        - source_ref
      properties:
        mount_path:
          type: string
        source_ref:
          type: string
          description: handle/uuid of the mounted source (config/model snapshot
        read_only:
          type: boolean
          default: true
      additionalProperties: true
    Network:
      type: object
      properties:
        ports:
          type: array
          items:
            $ref: '#/components/schemas/Port'
      additionalProperties: true
    Port:
      type: object
      required:
        - container_port
      properties:
        container_port:
          type: integer
          minimum: 1
          maximum: 65535
        published_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum:
            - tcp
            - udp
          default: tcp
        visibility:
          type: string
          enum:
            - loopback
            - internal
            - external
          default: internal
      additionalProperties: true
    Runtime:
      type: object
      properties:
        restart_policy:
          type: string
          enum:
            - always
            - on-failure
            - never
          default: always
        replicas:
          type: integer
          minimum: 0
          default: 1
      additionalProperties: true
