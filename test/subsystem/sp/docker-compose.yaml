# SP subsystem test stack. Shared env: test/subsystem/.env (see .env.example).

services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    env_file: ../.env
    environment:
      POSTGRESQL_DATABASE: service-provider
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRESQL_USER\" -d service-provider"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: docker.io/library/nats:2-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--version"]
      interval: 5s
      timeout: 5s
      retries: 5

  provider-wiremock:
    image: wiremock/wiremock:3x
    ports:
      - "9090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ../../..
      dockerfile: Containerfile
    env_file: ../.env
    environment:
      BIND_ADDRESS: ":8080"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: service-provider
      NATS_URL: "nats://nats:4222"
      AUTH_DISABLED: "true"
      DCM_ADMIN_SUBJECT: "test-admin-sub"
      # Tuned down from the 2m/10s production defaults so the self-heal
      # subsystem test doesn't have to wait minutes for a real sweep cycle.
      AGENT_PENDING_REQUEST_TIMEOUT: "5s"
      AGENT_SWEEP_INTERVAL: "2s"
      # Tuned down from the default of 3 so the retries-exhausted test
      # (single agent, no fallback) reaches "failed" in ~10-15s instead of
      # ~25-30s. Verified this doesn't change the outcome of the existing
      # two-agent self-heal tests: they resolve on their first retry
      # attempt, well under either limit.
      AGENT_PENDING_REQUEST_MAX_RETRIES: "1"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      provider-wiremock:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1alpha1/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nats_data:
