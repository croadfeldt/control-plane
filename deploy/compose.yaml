# DCM platform stack: control-plane monolith, optional UI and service providers.
#
# Image version: defaults to :main. Pin with CONTROL_PLANE_VERSION in .env.
# Local dev: `make compose-up` builds control-plane from the repo Containerfile.
#
# Credentials: copy deploy/.env.example to deploy/.env before starting (see deploy/RUN.md).
# Keycloak uses profile "auth" — pass AUTH=true to make compose-up / compose-up-with-providers.

x-db-common: &db-common
  DB_TYPE: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"

x-dcm-registration-url: &dcm-registration-url "http://control-plane:8080/api/v1alpha1"

services:
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.0.1
    command: ["start-dev", "--import-realm"]
    env_file: .env
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro,z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    image: docker.io/library/postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: docker.io/library/nats:2-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data

  control-plane:
    build:
      context: ..
      dockerfile: Containerfile
    image: quay.io/dcm-project/control-plane:${CONTROL_PLANE_VERSION:-main}
    pull_policy: always
    restart: on-failure
    env_file: .env
    environment:
      <<: *db-common
      BIND_ADDRESS: ":8080"
      DB_NAME: control-plane
      LOG_LEVEL: info
      NATS_URL: "nats://nats:4222"
      # Compose interpolates this on the host; make compose-up passes --env-file deploy/.env.
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  kubevirt-service-provider:
    container_name: ${KUBEVIRT_PROVIDER_NAME:-kubevirt-service-provider}
    profiles: ["providers", "kubevirt"]
    image: quay.io/dcm-project/kubevirt-service-provider:${KUBEVIRT_SERVICE_PROVIDER_VERSION:-main}
    pull_policy: always
    environment:
      NATS_URL: "nats://nats:4222"
      SERVICE_MANAGER_ENDPOINT: *dcm-registration-url
      PROVIDER_NAME: ${KUBEVIRT_PROVIDER_NAME:-kubevirt-service-provider}
      PROVIDER_ENDPOINT: "http://${KUBEVIRT_PROVIDER_NAME:-kubevirt-service-provider}:8081/api/v1alpha1/vms"
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-default}
      KUBERNETES_KUBECONFIG: /kubeconfig
    volumes:
      - ${KUBEVIRT_KUBECONFIG:-~/.kube/config}:/kubeconfig:ro,z
    depends_on:
      control-plane:
        condition: service_started

  k8s-container-service-provider:
    profiles: ["providers", "k8s-container", "three-tier"]
    image: quay.io/dcm-project/k8s-container-service-provider:${K8S_CONTAINER_SERVICE_PROVIDER_VERSION:-main}
    pull_policy: always
    environment:
      SP_NAME: ${K8S_CONTAINER_SP_NAME:-k8s-container-provider}
      SP_ENDPOINT: "http://k8s-container-service-provider:8080"
      DCM_REGISTRATION_URL: *dcm-registration-url
      SP_NATS_URL: "nats://nats:4222"
      SP_K8S_NAMESPACE: ${K8S_CONTAINER_SP_NAMESPACE:-default}
      SP_K8S_KUBECONFIG: /kubeconfig
      SP_K8S_EXTERNAL_SVC_TYPE: ${K8S_CONTAINER_SP_EXTERNAL_SVC_TYPE:-NodePort}
    expose:
      - "8080"
    volumes:
      - ${K8S_CONTAINER_SP_KUBECONFIG:-~/.kube/config}:/kubeconfig:ro,z
    depends_on:
      control-plane:
        condition: service_started
      nats:
        condition: service_started

  acm-cluster-service-provider:
    profiles: ["providers", "acm-cluster"]
    image: quay.io/dcm-project/acm-cluster-service-provider:${ACM_CLUSTER_SERVICE_PROVIDER_VERSION:-main}
    pull_policy: always
    env_file: .env
    environment:
      SP_NAME: ${ACM_CLUSTER_SP_NAME:-acm-cluster-sp}
      SP_ENDPOINT: "http://acm-cluster-service-provider:8080"
      DCM_REGISTRATION_URL: *dcm-registration-url
      SP_NATS_URL: "nats://nats:4222"
      SP_CLUSTER_NAMESPACE: ${ACM_CLUSTER_SP_NAMESPACE:-default}
      SP_BASE_DOMAIN: ${ACM_CLUSTER_SP_BASE_DOMAIN:-}
      SP_PULL_SECRET: ${ACM_CLUSTER_SP_PULL_SECRET:-}
      SP_DEFAULT_INFRA_ENV: ${ACM_CLUSTER_SP_DEFAULT_INFRA_ENV:-}
      SP_AGENT_NAMESPACE: ${ACM_CLUSTER_SP_AGENT_NAMESPACE:-}
      KUBECONFIG: /kubeconfig
    expose:
      - "8080"
    volumes:
      - ${ACM_CLUSTER_SP_KUBECONFIG:-~/.kube/config}:/kubeconfig:ro,z
    depends_on:
      control-plane:
        condition: service_started
      nats:
        condition: service_started

  k8s-storage-service-provider:
    profiles: ["providers", "storage"]
    image: quay.io/dcm-project/k8s-storage-service-provider:${K8S_STORAGE_SERVICE_PROVIDER_VERSION:-main}
    pull_policy: always
    environment:
      SP_NAME: ${K8S_STORAGE_SP_NAME:-k8s-storage-provider}
      SP_ENDPOINT: "http://k8s-storage-service-provider:8080"
      SP_SERVER_ADDRESS: ":8080"
      DCM_REGISTRATION_URL: *dcm-registration-url
      SP_NATS_URL: "nats://nats:4222"
      SP_K8S_NAMESPACE: ${K8S_STORAGE_SP_NAMESPACE:-default}
      SP_K8S_KUBECONFIG: /kubeconfig
      SP_K8S_DEFAULT_STORAGE_CLASS: ${K8S_STORAGE_SP_DEFAULT_STORAGE_CLASS:-}
      SP_K8S_DEFAULT_ACCESS_MODE: ${K8S_STORAGE_SP_DEFAULT_ACCESS_MODE:-ReadWriteOnce}
    expose:
      - "8080"
    volumes:
      - ${K8S_STORAGE_SP_KUBECONFIG:-~/.kube/config}:/kubeconfig:ro,z
    depends_on:
      control-plane:
        condition: service_started
      nats:
        condition: service_started

  dcm-ui:
    image: quay.io/dcm-project/dcm-ui:${DCM_UI_VERSION:-main}
    pull_policy: always
    ports:
      - "7007:7007"
    environment:
      APP_BASE_URL: http://localhost:7007
      DCM_API_URL: http://control-plane:8080
    depends_on:
      control-plane:
        condition: service_started

  three-tier-demo-service-provider:
    profiles: ["providers", "three-tier"]
    image: quay.io/dcm-project/three-tier-app-demo-service-provider:${THREE_TIER_DEMO_SERVICE_PROVIDER_VERSION:-main}
    pull_policy: always
    env_file: .env
    environment:
      <<: *db-common
      DB_NAME: three-tier-sp
      CONTAINER_SP_URL: "http://k8s-container-service-provider:8080"
      SP_NAME: ${THREE_TIER_SP_NAME:-three-tier-provider}
      SP_ENDPOINT: "http://three-tier-demo-service-provider:8080"
      DCM_REGISTRATION_URL: *dcm-registration-url
      SP_NATS_URL: "nats://nats:4222"
      SP_K8S_NAMESPACE: ${K8S_CONTAINER_SP_NAMESPACE:-default}
      SP_K8S_KUBECONFIG: /kubeconfig
    expose:
      - "8080"
    volumes:
      - ${K8S_CONTAINER_SP_KUBECONFIG:-~/.kube/config}:/kubeconfig:ro,z
    depends_on:
      control-plane:
        condition: service_started
      nats:
        condition: service_started
      k8s-container-service-provider:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data: {}
  nats_data: {}
