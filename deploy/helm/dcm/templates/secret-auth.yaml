{{- if and .Values.auth.enabled (not (or .Values.auth.proxySecret .Values.auth.authSecretRef)) }}
{{- fail "auth.proxySecret or auth.authSecretRef is required when auth.enabled=true" }}
{{- end }}
{{- if and .Values.auth.enabled (not .Values.auth.authSecretRef) }}
{{- $_ := required "auth.proxySecret is required when auth.enabled=true" .Values.auth.proxySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dcm.fullname" . }}-auth
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ .Values.auth.keycloak.adminUser | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ required "auth.keycloak.adminPassword is required when auth.enabled=true" .Values.auth.keycloak.adminPassword | quote }}
  DCM_DEV_USER_PASSWORD: {{ required "auth.keycloak.devUserPassword is required when auth.enabled=true" .Values.auth.keycloak.devUserPassword | quote }}
  AUTH_PROXY_SECRET: {{ .Values.auth.proxySecret | quote }}
{{- end }}
