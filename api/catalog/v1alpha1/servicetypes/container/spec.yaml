openapi: 3.0.4
info:
  title: DCM Container Specification
  description: |-
    Generated from the UDLM registry by cmd/udlm-servicetype-gen — DO NOT hand-edit.
    Provider-agnostic container workload specification; the UDLM resource type is the source of truth.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths: {}
components:
  schemas:
    ContainerSpec:
      type: object
      description: |-
        A container workload — image, resources, environment, mounts, and exposed ports — realized and managed by a *resource* provider (a Kubernetes cluster, podman) under the four-state lifecycle (DCM ADR-023). Models the service/workload layer of the estate: MCP servers, the media stack, mail, etc. Secret material is never inline — env/mounts reference a Security.CredentialRef.

        Provider-agnostic container workload specification, generated from the UDLM Container (v1.0.2) resource type — the UDLM registry is the source of truth. Non-portable provider settings go under provider_hints (CommonFields). Regenerate with cmd/udlm-servicetype-gen; do not hand-edit.

        Realized outputs (read-only, provider-populated): endpoint, internal_dns.
      allOf:
        - $ref: ../common.yaml#/components/schemas/CommonFields
        - type: object
          required:
            - image
          properties:
            image:
              description: The container image — either the inline OCI reference (first branch) OR a data_reference to a governed container_image reference-data layer. The reference form lets the control plane compute the change-impact blast radius when a base image or embedded library is bumped (UDLM ADR-012; DCM ADR-024) — an inline OCI string cannot be cascaded.
              oneOf:
                - $ref: '#/components/schemas/ImageInline'
                - type: string
                  format: udlm-ref-url
                  description: 'Constraint (UDLM allOf): reference_data_type = container_image.'
            command:
              type: array
              description: Entrypoint override.
              items:
                type: string
            args:
              type: array
              description: Converted verbatim from the flat Container spec.
              items:
                type: string
            resources:
              $ref: '#/components/schemas/Resources'
            process:
              $ref: '#/components/schemas/Process'
            network:
              $ref: '#/components/schemas/Network'
            runtime:
              $ref: '#/components/schemas/Runtime'
            endpoint:
              type: string
              description: |-
                Reachable endpoint once Realized.

                UDLM realized output: populated by the provider when the resource reaches Realized; read-only on the request.
              readOnly: true
            internal_dns:
              type: string
              description: |-
                In-cluster / on-host DNS name.

                UDLM realized output: populated by the provider when the resource reaches Realized; read-only on the request.
              readOnly: true
          additionalProperties: true
    ImageInline:
      type: object
      required:
        - reference
      properties:
        reference:
          type: string
          description: OCI image reference, e.g. registry.example.com/org/app:1.0
        digest:
          type: string
          description: OCI content-addressable digest, pinned at Realized/Discovered for provenance.
          pattern: ^sha256:[a-f0-9]{64}$
      additionalProperties: true
    Resources:
      type: object
      description: Converted verbatim from the flat Container spec.
      properties:
        instance_size:
          type: string
          description: Provider-neutral size class (small|medium|large) — size by class in place of cpu/memory; the provider maps it at naturalization (common-elements §2.2, ADR-014).
        cpu:
          type: number
          description: vCPU request in cores.
          minimum: 0.1
        memory:
          type: string
          pattern: ^[0-9]+(Mi|Gi|MB|GB)$
      additionalProperties: true
    Process:
      type: object
      description: Converted verbatim from the flat Container spec.
      properties:
        env:
          type: array
          items:
            $ref: '#/components/schemas/Env'
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/Mount'
      additionalProperties: true
    Env:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        value:
          type: string
          description: Literal value — non-secret only.
        value_from:
          $ref: '#/components/schemas/ValueFrom'
      additionalProperties: true
    ValueFrom:
      type: object
      description: Reference to a Security.CredentialRef or config source. Secret material is NEVER inline (DCM ADR-023).
      properties:
        credential_ref:
          type: string
          description: handle or uuid of a Security.CredentialRef
        key:
          type: string
      additionalProperties: true
    Mount:
      type: object
      required:
        - mount_path
        - source_ref
      properties:
        mount_path:
          type: string
        source_ref:
          type: string
          description: handle/uuid of the mounted source (config/model snapshot, or a CredentialRef for secrets).
        read_only:
          type: boolean
      additionalProperties: true
    Network:
      type: object
      description: Converted verbatim from the flat Container spec.
      properties:
        ports:
          type: array
          items:
            $ref: '#/components/schemas/Port'
      additionalProperties: true
    Port:
      type: object
      required:
        - container_port
      properties:
        container_port:
          type: integer
          minimum: 1
          maximum: 65535
        published_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum:
            - tcp
            - udp
        visibility:
          type: string
          enum:
            - loopback
            - internal
            - external
      additionalProperties: true
    Runtime:
      type: object
      description: Converted verbatim from the flat Container spec.
      properties:
        restart_policy:
          type: string
          enum:
            - always
            - on-failure
            - never
        replicas:
          type: integer
          minimum: 0
      additionalProperties: true
