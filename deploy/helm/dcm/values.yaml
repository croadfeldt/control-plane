# Schema: deploy/helm/dcm/values.schema.json (keep in sync when changing any defaults)
# -- Global settings
global:
  imageTag: main

# -- PostgreSQL
postgres:
  image: docker.io/library/postgres:16-alpine
  user: admin
  password: adminpass
  storage: 1Gi

# -- NATS
nats:
  image: docker.io/library/nats:2-alpine
  storage: 1Gi

# -- Control-plane monolith (catalog, policy, placement, SP manager)
controlPlane:
  image: quay.io/dcm-project/control-plane
  tag: ""  # defaults to global.imageTag
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  route:
    enabled: true
    host: ""  # leave empty for auto-generated OpenShift hostname
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: []
    annotations: {}

# -- Authentication (mirrors compose: Keycloak + control-plane JWT/proxy-header auth)
auth:
  enabled: false
  adminSubject: "56deb662-4820-5d83-b828-f4beb11a5fa7"  # synced with realm-export.json; CI verifies via helm-chart-verify-admin-subject
  proxySecret: "dcm-dev-proxy-secret"
  authSecretRef: ""  # name of a pre-existing Secret in the release namespace (see README); when set, inline defaults are ignored
  jwtAudience: "dcm-api"  # empty = skip audience check
  issuerURL: ""  # empty = http://<fullname>-keycloak:8080/realms/dcm; also drives KC_HOSTNAME
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    adminUser: admin
    adminPassword: admin
    # Prefer simple passwords; shell substitution in the Keycloak entrypoint is fragile with special chars
    devUserPassword: admin
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    route:
      enabled: false
      host: ""  # leave empty for auto-generated OpenShift hostname
    ingress:
      enabled: false
      className: ""
      host: ""
      tls: []
      annotations: {}

# -- DCM UI
dcmUi:
  enabled: true
  image: quay.io/dcm-project/dcm-ui
  tag: ""
  route:
    enabled: true
    host: ""
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: []
    annotations: {}

# -- Optional service providers (disabled by default)
kubevirtServiceProvider:
  enabled: false
  image: quay.io/dcm-project/kubevirt-service-provider
  tag: ""
  providerName: kubevirt-service-provider
  namespace: default
  kubeconfig: ""  # base64-encoded kubeconfig content for the Secret

k8sContainerServiceProvider:
  enabled: false
  image: quay.io/dcm-project/k8s-container-service-provider
  tag: ""
  spName: k8s-container-provider
  namespace: default
  externalSvcType: NodePort
  kubeconfig: ""

acmClusterServiceProvider:
  enabled: false
  image: quay.io/dcm-project/acm-cluster-service-provider
  tag: ""
  spName: acm-cluster-sp
  namespace: default
  baseDomain: ""
  pullSecret: ""  # base64-encoded .dockerconfigjson (required unless pullSecretRef is set)
  pullSecretRef: ""  # existing Secret in release namespace; key pull-secret (see README)
  defaultInfraEnv: ""
  agentNamespace: ""
  kubeconfig: ""  # raw kubeconfig content; omit for in-cluster SA auth with auto-created RBAC
  kubeconfigRef: ""  # existing Secret in release namespace with key kubeconfig

threeTierDemoServiceProvider:
  enabled: false
  image: quay.io/dcm-project/three-tier-app-demo-service-provider
  tag: ""
  spName: three-tier-provider
  namespace: default
  kubeconfig: ""
