# Schema: deploy/helm/dcm/values.schema.json (keep in sync when changing any defaults)
# -- Global settings
global:
  imageTag: main

# -- PostgreSQL
postgres:
  image: docker.io/library/postgres:16-alpine
  dbSecretRef: dcm-db  # pre-created Secret in release namespace (see README)
  storage: 1Gi

# -- NATS
nats:
  image: docker.io/library/nats:2-alpine
  storage: 1Gi

# -- Control-plane monolith (catalog, policy, placement, SP manager)
controlPlane:
  image: quay.io/dcm-project/control-plane
  tag: mc-r2  # empty defaults to global.imageTag
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  route:
    enabled: true
    host: ""  # leave empty for auto-generated OpenShift hostname
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: []
    annotations: {}

# -- Authentication (mirrors compose: Keycloak + control-plane JWT/proxy-header auth)
auth:
  enabled: false
  adminSubject: "56deb662-4820-5d83-b828-f4beb11a5fa7"  # synced with realm-export.json; CI verifies via helm-chart-verify-admin-subject
  authSecretRef: dcm-auth  # pre-created Secret when auth.enabled=true (see README)
  jwtAudience: "dcm-api"  # empty = skip audience check
  issuerURL: ""  # empty = http://<fullname>-keycloak:8080/realms/dcm; also drives KC_HOSTNAME
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    route:
      enabled: false
      host: ""  # leave empty for auto-generated OpenShift hostname
    ingress:
      enabled: false
      className: ""
      host: ""
      tls: []
      annotations: {}

# -- DCM UI
dcmUi:
  enabled: true
  image: quay.io/dcm-project/dcm-ui
  tag: m2-rc1  # empty defaults to global.imageTag
  route:
    enabled: true
    host: ""
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: []
    annotations: {}

# -- Optional environment-agent (embedded SPs; in-cluster auth only)
environmentAgent:
  enabled: false
  image: quay.io/dcm-project/environment-agent
  tag: m2-rc1  # empty defaults to global.imageTag
  agentName: cluster-agent
  environment: dev
  cost: medium
  embeddedSps: ""  # comma-separated: container, vm, storage, network, cluster
  containerNamespace: default
  vmNamespace: default
  storageNamespace: default
  networkNamespace: default
  externalSvcType: LoadBalancer  # NodePort for Kind/lab if needed
  clusterNamespace: clusters
  baseDomain: ""
  pullSecretRef: ""  # required when embeddedSps includes cluster
  clusterInfraEnv: ""  # baremetal default InfraEnv (SP_DEFAULT_INFRA_ENV)
  clusterAgentNamespace: ""  # ACM Agent CR namespace (not the agent Pod namespace)
  authClientID: dcm-proxy  # Keycloak client for DCM registration when auth.enabled
