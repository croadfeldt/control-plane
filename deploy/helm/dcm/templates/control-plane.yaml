apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dcm.fullname" . }}-control-plane
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
    {{- include "dcm.selectorLabels" (dict "context" . "component" "control-plane") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dcm.selectorLabels" (dict "context" . "component" "control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dcm.selectorLabels" (dict "context" . "component" "control-plane") | nindent 8 }}
      {{- if .Values.auth.enabled }}
      annotations:
        {{- if not .Values.auth.authSecretRef }}
        checksum/auth-secret: {{ include (print $.Template.BasePath "/secret-auth.yaml") . | sha256sum }}
        {{- end }}
        checksum/realm: {{ required "auth.enabled=true requires deploy/helm/dcm/files/realm-export.json. Run: make helm-chart-sync" (.Files.Get "files/realm-export.json") | sha256sum }}
      {{- end }}
    spec:
      initContainers:
        {{- include "dcm.waitForPostgres" . | nindent 8 }}
        {{- if .Values.auth.enabled }}
        {{- include "dcm.waitForKeycloak" . | nindent 8 }}
        {{- end }}
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image }}:{{ include "dcm.imageTag" (dict "tag" .Values.controlPlane.tag "global" .Values.global) }}"
          securityContext:
            {{- toYaml .Values.controlPlane.securityContext | nindent 12 }}
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "dcm.fullname" . }}-db
          env:
            - name: DB_TYPE
              value: pgsql
            - name: DB_HOST
              value: {{ include "dcm.fullname" . }}-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: control-plane
            - name: BIND_ADDRESS
              value: ":8080"
            - name: LOG_LEVEL
              value: info
            - name: NATS_URL
              value: "nats://{{ include "dcm.fullname" . }}-nats:4222"
            - name: AUTH_DISABLED
              value: {{ if .Values.auth.enabled }}"false"{{ else }}"true"{{ end }}
            {{- if .Values.auth.enabled }}
            - name: DCM_ADMIN_SUBJECT
              value: {{ .Values.auth.adminSubject | quote }}
            - name: AUTH_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcm.authSecretName" . }}
                  key: AUTH_PROXY_SECRET
            - name: AUTH_ISSUER_URL
              value: {{ include "dcm.authIssuerURL" . | quote }}
            {{- if .Values.auth.jwtAudience }}
            - name: AUTH_JWT_AUDIENCE
              value: {{ .Values.auth.jwtAudience | quote }}
            {{- end }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dcm.fullname" . }}-control-plane
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dcm.selectorLabels" (dict "context" . "component" "control-plane") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
{{- if .Values.controlPlane.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "dcm.fullname" . }}-control-plane
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
spec:
  {{- if .Values.controlPlane.route.host }}
  host: {{ .Values.controlPlane.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "dcm.fullname" . }}-control-plane
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- if .Values.controlPlane.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dcm.fullname" . }}-control-plane
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
  {{- with .Values.controlPlane.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.controlPlane.ingress.className }}
  ingressClassName: {{ .Values.controlPlane.ingress.className }}
  {{- end }}
  rules:
    - {{- if .Values.controlPlane.ingress.host }}
      host: {{ .Values.controlPlane.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dcm.fullname" . }}-control-plane
                port:
                  number: 8080
  {{- with .Values.controlPlane.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
