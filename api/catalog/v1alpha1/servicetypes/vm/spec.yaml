openapi: 3.0.4

info:
  title: DCM Virtual Machine Specification
  description: |
    Provider-agnostic virtual machine specification, aligned to the UDLM
    Compute.VirtualMachine resource type (the UDLM registry is the source of truth).

    Portable fields common across virtualization platforms (KubeVirt, VMware vSphere,
    OpenStack, AWS, Azure, GCP). Provider-specific configuration goes via provider_hints
    (the CommonFields extension surface). placement and networks SELECT existing
    Facility.Location / Network.VirtualNetwork resources rather than defining them.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

paths: {}

components:
  schemas:
    VMSpec:
      type: object
      description: |
        Provider-agnostic virtual machine specification (UDLM Compute.VirtualMachine).
        Only guest_os is required; size is expressed via instance_size OR vcpu+memory.
        Providers translate this abstract specification to their native format at
        naturalization.
      allOf:
        - $ref: '../common.yaml#/components/schemas/CommonFields'
        - type: object
          required:
            - guest_os
          properties:
            instance_size:
              type: string
              description: |
                Provider-neutral size class (small|medium|large, ordered/comparable) IN
                PLACE OF vcpu+memory; the provider maps it to concrete resources at
                naturalization. Use instance_size OR vcpu+memory.
              example: medium

            vcpu:
              $ref: '#/components/schemas/Vcpu'

            memory:
              $ref: '#/components/schemas/Memory'

            guest_os:
              $ref: '#/components/schemas/GuestOS'

            disks:
              type: array
              description: Virtual disk specifications.
              items:
                $ref: '#/components/schemas/Disk'

            placement:
              $ref: '#/components/schemas/Placement'

            networks:
              type: array
              description: |
                Network attachment intent — each entry SELECTS an existing
                Network.VirtualNetwork the NIC attaches to.
              items:
                $ref: '#/components/schemas/NetworkAttachment'

            power:
              $ref: '#/components/schemas/Power'

          additionalProperties: true

    Vcpu:
      type: object
      description: Virtual CPU configuration.
      required:
        - count
      properties:
        count:
          type: integer
          description: Number of virtual CPUs.
          minimum: 1
          example: 4
      additionalProperties: true

    Memory:
      type: object
      description: Memory configuration (RAM).
      required:
        - size
      properties:
        size:
          type: string
          description: Memory allocation with unit suffix, e.g. 16GB.
          pattern: '^[0-9]+(MB|GB|TB)$'
          example: 16GB
      additionalProperties: true

    GuestOS:
      type: object
      description: |
        Guest operating system configuration. Providers map the OS type to their
        image catalog (KubeVirt DataVolume, VMware template, AWS AMI, ...).
      required:
        - type
      properties:
        type:
          type: string
          description: Guest OS image identifier, e.g. rhel-9.
          example: rhel-9
      additionalProperties: true

    Disk:
      type: object
      description: Virtual disk specification.
      required:
        - size
      properties:
        size:
          type: string
          description: Disk capacity with unit suffix (GB, TB).
          pattern: '^[0-9]+(GB|TB)$'
          example: 100GB
        storage_class:
          type: string
          description: Optional storage class the provider maps to a concrete backend.
      additionalProperties: true

    Placement:
      type: object
      description: |
        Placement intent expressed as a SELECTION of an existing Facility.Location
        (plus affinity relative to other existing resources). Policy governs which
        locations a consumer may select; the VM references one, it does not define
        locations itself.
      properties:
        location_ref:
          type: string
          description: handle/uuid of an existing Facility.Location the VM is placed in.
      additionalProperties: true

    NetworkAttachment:
      type: object
      description: |
        Network attachment intent — SELECTS an existing Network.VirtualNetwork the NIC
        attaches to. The responsible network provider and policy decide eligibility.
      required:
        - network_ref
      properties:
        name:
          type: string
          description: Local NIC name, e.g. eth0.
        network_ref:
          type: string
          description: handle/uuid of an existing Network.VirtualNetwork.
      additionalProperties: true

    Power:
      type: object
      description: |
        Desired guest power state the provider drives to (KubeVirt runStrategy /
        Redfish PowerState). Distinct from the four-state lifecycle_state.
      properties:
        desired_state:
          type: string
          description: Target guest power state.
          enum:
            - running
            - stopped
            - suspended
          default: running
      additionalProperties: true
