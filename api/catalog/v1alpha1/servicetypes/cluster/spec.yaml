openapi: 3.0.4
info:
  title: DCM Cluster Specification
  description: |-
    Generated from the UDLM registry by cmd/udlm-servicetype-gen — DO NOT hand-edit.
    Provider-agnostic Kubernetes cluster specification; the UDLM resource type is the source of truth.
  version: v1alpha1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths: {}
components:
  schemas:
    ClusterSpec:
      type: object
      description: |-
        A Kubernetes cluster as one orderable deliverable — release and network ranges. It carries no node pools: a pool is a KubernetesNodePool record contained by the cluster, ordered, scaled and retired on its own, and a cluster with its pools is a composition (ruling 072, 2026-09-12). A cluster record may therefore have zero worker pools, as a hosted control plane or an EKS cluster does at creation. A Base Class in its own right (ADR-068): its contract is the Kubernetes API, which every conformant distribution honors, so an order placed here can be realized by any provider offering one. Named for the standard, never for a product — distributions (OpenShift, EKS, k3s, …) are the Type tier beneath it and offerings the Provider tier. `pod_cidr`/`service_cidr` are Kubernetes vocabulary, which is why this left `Compute`: a VM or a bare-metal host cannot honor them. Derived from OSAC's `cluster` fulfillment type (osac-project/fulfillment-service; its inline node sets map to KubernetesNodePool records); target Network.VirtualNetwork is registered; the fleet manager is a Software.Service of service_kind fleet-manager (ADR-043 relationship semantics).

        Provider-agnostic Kubernetes cluster specification, generated from the UDLM KubernetesCluster (v2.0.0) resource type — the UDLM registry is the source of truth. Non-portable provider settings go under provider_hints (CommonFields). Regenerate with cmd/udlm-servicetype-gen; do not hand-edit.

        Realized outputs (read-only, provider-populated): api_url, console_url, kubeconfig, cluster_id.
      allOf:
        - $ref: ../common.yaml#/components/schemas/CommonFields
        - type: object
          required:
            - release
          properties:
            release:
              type: string
              description: Platform release, e.g. 1.30 (a Kubernetes minor release) or a distribution's release stream.
            network:
              $ref: '#/components/schemas/Network'
            api_url:
              type: string
              description: |-
                Cluster API server URL once Realized.

                UDLM realized output: populated by the provider when the resource reaches Realized; read-only on the request.
              readOnly: true
            console_url:
              type: string
              description: |-
                Web console URL.

                UDLM realized output: populated by the provider when the resource reaches Realized; read-only on the request.
              readOnly: true
            kubeconfig:
              type: string
              description: |-
                Admin kubeconfig.

                UDLM realized output: populated by the provider when the resource reaches Realized; read-only on the request. Sensitive: never logged, echoed, or diffed.
              readOnly: true
            cluster_id:
              type: string
              description: |-
                Provider-assigned cluster identifier.

                UDLM realized output: populated by the provider when the resource reaches Realized; read-only on the request.
              readOnly: true
          additionalProperties: true
    Network:
      type: object
      description: Converted verbatim from the flat cluster spec.
      properties:
        pod_cidr:
          type: string
          pattern: ^[0-9./]+$
        service_cidr:
          type: string
          pattern: ^[0-9./]+$
      additionalProperties: true
